name: LE iPhone Duo candidate
on:
  push:
    branches: [le-release-eccd30d55c]
permissions:
  contents: read
jobs:
  ios:
    runs-on: xcode-27
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify source and select Xcode
        run: |
          echo "eccd30d55c0f28c1aaab61702b0cbf84d6fe2d189fe07590fce5381c211246a5  LEWords-public-source.zip" | shasum -a 256 -c -
          unzip -q LEWords-public-source.zip -d le-words
          echo "DEVELOPER_DIR=/Applications/Xcode_27.1.app/Contents/Developer" >> "$GITHUB_ENV"
      - name: Check native account isolation
        working-directory: le-words
        run: |
          mkdir -p ios/build
          swiftc ios/Sources/App/StudyAccounts.swift tests/accounts/main.swift -o ios/build/account-tests
          ios/build/account-tests | tee ios/build/account-tests.log
      - name: Check learning rules
        run: node le-words/tests/core.test.cjs
      - name: Install XcodeGen
        run: command -v xcodegen || brew install xcodegen
      - name: Compile simulator and iPhone
        working-directory: le-words/ios
        run: cd .. && bash duo_build.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: le-local-accounts
          path: |
            le-words/ios/build/*.zip
            le-words/ios/build/*.log
            le-words/ios/build/native-screenshots/**
          retention-days: 3
